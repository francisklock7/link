<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--black:#080808;--white:#f2f1ec;--gray:#666;--lgray:#999;--border:rgba(242,241,236,0.09);--mono:"Space Mono",monospace;--sans:"DM Sans",sans-serif}
html{height:100%}
body{min-height:100%;background:var(--black);color:var(--white);font-family:var(--sans);font-weight:300;line-height:1.6;display:flex;flex-direction:column;align-items:center;position:relative;overflow-x:hidden;padding:max(3.5rem,env(safe-area-inset-top)) 1.5rem max(2rem,env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:0;opacity:0.035;background-image:linear-gradient(rgba(242,241,236,0.5) 1px,transparent 1px),linear-gradient(90deg,rgba(242,241,236,0.5) 1px,transparent 1px);background-size:80px 80px;pointer-events:none}
:focus-visible{outline:2px solid var(--white);outline-offset:3px}
main{position:relative;width:100%;max-width:440px;margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center}
.avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;filter:grayscale(100%);border:0.5px solid rgba(242,241,236,0.25);margin-bottom:1.6rem}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:0.22em;color:var(--gray);text-transform:uppercase;margin-bottom:0.9rem}
h1{font-family:var(--mono);font-size:clamp(1.9rem,8vw,2.4rem);font-weight:700;line-height:1;letter-spacing:-0.03em;margin-bottom:1rem}
.bio{font-size:15px;color:var(--lgray);line-height:1.7;max-width:27em;margin-bottom:2.4rem}
.links{width:100%;display:flex;flex-direction:column;gap:0.8rem}
.btn{display:flex;justify-content:space-between;align-items:center;gap:1rem;width:100%;min-height:72px;padding:1.1rem 1.4rem;text-align:left;text-decoration:none;transition:opacity 0.2s,border-color 0.2s,background 0.2s}
.btn-text{display:flex;flex-direction:column;gap:0.15rem}
.btn-title{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase}
.btn-sub{font-size:13.5px;font-weight:400;line-height:1.4}
.btn-arrow{font-family:var(--mono);font-size:18px;flex-shrink:0;transition:transform 0.2s}
.btn:hover .btn-arrow{transform:translateX(4px)}
.btn-primary{background:var(--white);color:var(--black)}
.btn-primary .btn-sub{color:#555}
.btn-primary:hover{opacity:0.92}
.btn-secondary{color:var(--white);border:0.5px solid rgba(242,241,236,0.28)}
.btn-secondary .btn-sub{color:var(--lgray)}
.btn-secondary:hover{border-color:rgba(242,241,236,0.7);background:rgba(242,241,236,0.04)}
footer{position:relative;margin-top:2.6rem;font-family:var(--mono);font-size:10px;letter-spacing:0.12em;color:#444;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
